name: Focused public Blooio timing qualification
on:
  push:
    branches: [codex/qualify-gateway-blooio-timing]
permissions:
  contents: read
concurrency:
  group: focused-public-blooio-timing
  cancel-in-progress: false
jobs:
  gateway-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b06f801c5aef2b61de9b8b38a0aa250a6ad5ac23
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.15.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Read exact reviewed launcher from qualification-only commit
        env:
          QUALIFICATION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b06f801c5aef2b61de9b8b38a0aa250a6ad5ac23
          curl --fail --silent --show-error --max-time 30 \
            "https://raw.githubusercontent.com/elizaOS/eliza/$QUALIFICATION_SHA/packages/scripts/qualify-gateway-blooio-timing.sh" \
            --output "$RUNNER_TEMP/gateway-qualification.sh"
          printf '%s  %s\n' 3262d381f921e1b59b202ae1e7e73ebd39bc22bb6cc9ee260bcbc3a5c002cdd9 "$RUNNER_TEMP/gateway-qualification.sh" | sha256sum --check --status
          bash -n "$RUNNER_TEMP/gateway-qualification.sh"
          command -v timeout
          command -v unshare
          sudo -n unshare --net -- bash -c 'ip link set lo up; test -z "$(ip route show)"'
      - name: Pruned real source closure, formatter first, three cases, Gateway types and build
        run: |
          set -euo pipefail
          timeout --kill-after=10s 600s bash "$RUNNER_TEMP/gateway-qualification.sh" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/gateway-public-capsule" "$RUNNER_TEMP/gateway-public-evidence"
      - name: Preserve focused source and qualification receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-blooio-timing-public
          path: |
            ${{ runner.temp }}/gateway-public-evidence/*.log
            ${{ runner.temp }}/gateway-public-evidence/*.json
            ${{ runner.temp }}/gateway-public-evidence/*.bun.lock
            ${{ runner.temp }}/gateway-public-evidence/*sha256.txt
            ${{ runner.temp }}/gateway-public-evidence/source-commit.txt
            ${{ runner.temp }}/gateway-public-evidence/gateway-index.js
          retention-days: 7
